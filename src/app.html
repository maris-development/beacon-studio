<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <script>
            // Set the theme before the first paint. services/theme.ts applies the same rule later.
            try {
                var theme = JSON.parse(
                    localStorage.getItem("beacon-studio.settings") || "{}"
                ).theme;
                var dark =
                    theme === "dark" ||
                    (theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
                document.documentElement.classList.toggle("dark", dark);
                document.documentElement.style.colorScheme = dark ? "dark" : "light";
            } catch (error) {
                // No storage or no matchMedia: the app sets the theme when it starts.
            }
        </script>
        <link
            rel="icon"
            type="image/png"
            href="%sveltekit.assets%/favicons/favicon-96x96.png"
            sizes="96x96"
        />
        <link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicons/favicon.svg" />
        <link rel="shortcut icon" href="%sveltekit.assets%/favicons/favicon.ico" />
        <link rel="manifest" href="%sveltekit.assets%/favicons/site.webmanifest" />
        <link
            rel="apple-touch-icon"
            sizes="180x180"
            href="%sveltekit.assets%/favicons/apple-touch-icon.png"
        />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        %sveltekit.head%
    </head>
    <body data-sveltekit-preload-data="hover">
        <div id="svelte-body">%sveltekit.body%</div>
    </body>
</html>
